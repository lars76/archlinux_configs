# ===============================================================
# Kitty Terminal Configuration
# ===============================================================
#
# Clean, modern appearance using the Catppuccin Mocha palette (matched to the
# vim colorscheme, so terminal and editor share one theme), with intuitive,
# browser-style keyboard shortcuts.
#

## Fonts
# ---------------------------------------------------------------
font_family             JetBrains Mono
bold_font               auto
italic_font             auto
bold_italic_font        auto
font_size               11.0

# Enables programming ligatures for symbols like ->, !=, etc.
disable_ligatures       never

## Appearance & Theming
# ---------------------------------------------------------------

### Window & Tab Bar
# Hides the OS window decorations (title bar).
hide_window_decorations titlebar-only

# Gives tabs a rounded, pill-like shape.
tab_bar_style           powerline
tab_powerline_style     round

# Show the bar tab for >=2
tab_bar_min_tabs        2

# Sets the title format for tabs (e.g., "1: zsh").
tab_title_template      "{index}: {title}"

# Adds some empty space around the terminal content.
window_padding_width    12

### Color Scheme (Catppuccin Mocha)
# Matches the vim colorscheme so the terminal and editor share one palette.
# Source: catppuccin/kitty (themes/mocha.conf).
background              #1e1e2e
foreground              #cdd6f4
cursor                  #f5e0dc
selection_foreground    #1e1e2e
selection_background    #f5e0dc
url_color               #f5e0dc

# Tab bar
# The active tab is a dark fill with mauve text, rather than upstream's solid
# mauve pill. Filled, it was the loudest thing on the screen, and what it
# reports — which tab has focus — is already obvious from the content below it.
# Surface1 sits ~1.9x above the inactive tabs and ~2.1x above the bar, so focus
# still reads at a glance, and the mauve stops competing with Claude Code's own.
active_tab_foreground   #cba6f7
active_tab_background   #45475a
active_tab_font_style   bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# The 16 base terminal colors.
# Black
color0                  #45475a
color8                  #585b70
# Red
color1                  #f38ba8
color9                  #f38ba8
# Green
color2                  #a6e3a1
color10                 #a6e3a1
# Yellow
color3                  #f9e2af
color11                 #f9e2af
# Blue
color4                  #89b4fa
color12                 #89b4fa
# Magenta
color5                  #f5c2e7
color13                 #f5c2e7
# Cyan
color6                  #94e2d5
color14                 #94e2d5
# White
color7                  #bac2de
color15                 #a6adc8

## Behavior & Functionality
# ---------------------------------------------------------------
cursor_shape            block
cursor_blink_interval   0

# Keep a generous scrollback buffer (kitty's default is only 2000 lines).
scrollback_lines        10000

# Makes text under the cursor use the background color, ensuring readability.
cursor_text_color       background

# Disables the audible terminal bell. 🔔
enable_audio_bell       no

# Allows other programs to control Kitty.
allow_remote_control    yes

## Keyboard Shortcuts
# ---------------------------------------------------------------
# Remaps default Kitty shortcuts (often Ctrl+Shift+...) to more
# common, browser-like keybindings (e.g., Ctrl+C, Ctrl+T).

### Clipboard
# Standard, conflict-free clipboard shortcuts
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard

### Tab Management
map ctrl+t              new_tab
map ctrl+tab            next_tab
map ctrl+shift+tab      previous_tab

# NOTE: The mapping for 'ctrl+w' overrides the default shell behavior
# of deleting the previous word. If you use that shell feature frequently,
# you may want to comment out or change this line.
map ctrl+w              close_tab

### Pane (Split) Management
# Create new panes (splits)
map ctrl+shift+d        launch --location=vsplit --cwd=current
map ctrl+shift+e        launch --location=hsplit --cwd=current

# Navigate between panes
map ctrl+shift+h        neighboring_window left
map ctrl+shift+l        neighboring_window right
map ctrl+shift+k        neighboring_window up
map ctrl+shift+j        neighboring_window down

### Font Size
map ctrl+plus           change_font_size all +1.0
map ctrl+equal          change_font_size all +1.0
map ctrl+minus          change_font_size all -1.0
map ctrl+0              change_font_size all 0

### Scroll up/down
map ctrl+shift+up    scroll_page_up
map ctrl+shift+down  scroll_page_down

### Kittens (Kitty Helper Apps)
# Open the Unicode character/emoji picker.
map ctrl+shift+u        kitten unicode_input

# To prevent default shortcuts (like ctrl+shift+c) from working,
# you can uncomment the line below. This forces all keybindings
# to be defined explicitly in this file.
# clear_all_shortcuts no